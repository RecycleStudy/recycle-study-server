spring:
  application:
    name: recyclestudy

  threads:
    virtual:
      enabled: true
  profiles:
    active: local

  config:
    import:
      - optional:file:.env[.properties]

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  flyway:
    enabled: true

  jpa:
    hibernate:
      ddl-auto: validate

    open-in-view: false


server:
  tomcat:
    mbeanregistry:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: prometheus, health

  metrics:
    tags:
      application: ${spring.application.name}

  prometheus:
    metrics:
      export:
        enabled: true

  tracing:
    sampling:
      probability: 1.0

  otlp:
    tracing:
      endpoint: ${ALLOY_URL}
      transport: grpc

auth:
  base-url: ${BASE_URL}

schedule:
  review-mail:
    cron: "0 * * * * *"
