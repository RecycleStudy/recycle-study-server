spring:
  datasource:
    url: jdbc:mysql://mysql:3306/recycle_study?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
    username: perftest
    password: perftest

  mail:
    host: toxiproxy
    port: 25025
    username: perftest
    password: perftest
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

  task:
    execution:
      pool:
        core-size: 8

  jpa:
    properties:
      hibernate:
        format_sql: false
        show_sql: false

management:
  endpoints:
    web:
      exposure:
        include: prometheus, health

  metrics:
    tags:
      application: ${spring.application.name}

  prometheus:
    metrics:
      export:
        enabled: true

  tracing:
    sampling:
      probability: 1.0

  otlp:
    tracing:
      endpoint: http://host.docker.internal:4317

auth:
  base-url: http://localhost:8080

perftest:
  email:
    delay-ms: 3163
    jitter-ms: 257
